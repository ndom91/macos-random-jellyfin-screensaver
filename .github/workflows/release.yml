name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and release screensaver
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build screensaver
        run: make clean build

      - name: Prepare release metadata
        id: release
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "asset=JellyfinRandomMovieScreensaver-${SHORT_SHA}.zip" >> "$GITHUB_OUTPUT"

      - name: Package screensaver
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Debug/JellyfinRandomMovieScreensaver.saver" \
            "${{ steps.release.outputs.asset }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.asset }}" \
            --title "${{ steps.release.outputs.short_sha }}" \
            --notes "Build from commit ${{ github.sha }}." \
            --latest
